theme: jekyll-theme-minimal
title: Calypso Networks Association Terminal API Documentation
url: "https://docs.terminal-api.calypsonet.org"
plugins:
  - jekyll-sitemap
defaults:
  - scope:
      path: "*/[0-9]*"
    values:
      sitemap: false
  # Dated copies kept in latest-stable/: the fixed link latest-stable/ is the
  # only entry listed for the latest stable version.
  - scope:
      path: "*/latest-stable/[0-9]*"
    values:
      sitemap: false
  # Disallowed in robots.txt, so not to be submitted either.
  - scope:
      path: "archived"
    values:
      sitemap: false
  # Former paths (repository names), now redirect pages to the short slugs.
  - scope:
      path: "calypsonet-terminal-*"
    values:
      sitemap: false
include:
  - "_*.html"